<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MechQTools - Engineering & Quality Tools</title>
<meta name="description" content="MechQTools provides free mechanical engineering, sheet metal, GD&T and quality engineering tools, calculators, templates and guides.">
<meta name="keywords" content="Mechanical Engineering Tools, Sheet Metal Calculator, Quality Tools, GD&T, Bend Allowance, Bend Deduction, Engineering Calculator">
<meta name="author" content="Amar Kumar Yadav">
<meta name="theme-color" content="#e53232">

<link rel="canonical" href="https://amary1699-boop.github.io/MechQTools/">

<style>
:root {
    --primary: #e53232;
    --primary-dark: #c82020;
    --text: #202938;
    --muted: #687386;
    --border: #e7eaf0;
    --light: #f7f8fa;
    --white: #ffffff;
    --shadow: 0 10px 35px rgba(25, 35, 50, 0.07);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background: var(--white);
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}

/* HEADER */

.site-header {
    width: 100%;
    background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.header-inner {
    max-width: 1200px;
    min-height: 76px;
    margin: auto;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.logo-mark {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: 800;
}

.logo-name {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.7px;
    color: #202938;
}

.logo-name span {
    color: var(--primary);
}

.logo-tagline {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.6px;
    margin-top: -4px;
}

.main-nav {
    display: flex;
    align-items: center;
    gap: 5px;
}

.nav-link,
.nav-trigger {
    border: 0;
    background: transparent;
    color: #394354;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 13px;
    border-radius: 7px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: 0.2s;
}

.nav-link:hover,
.nav-trigger:hover,
.nav-item.open > .nav-trigger {
    background: #fff1f1;
    color: var(--primary);
}

.nav-arrow {
    font-size: 11px;
    transition: transform 0.2s;
}

.nav-item.open .nav-arrow {
    transform: rotate(180deg);
}

.nav-item {
    position: relative;
}

.dropdown {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    width: 310px;
    padding: 13px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(20, 30, 45, 0.14);
    display: none;
    max-height: 75vh;
    overflow-y: auto;
}

.nav-item.open .dropdown {
    display: block;
}

.dropdown-heading {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    padding: 7px 10px 10px;
}

.dropdown a {
    display: block;
    padding: 9px 11px;
    border-radius: 7px;
    font-size: 13px;
    color: #394354;
    transition: 0.2s;
}

.dropdown a:hover {
    background: #fff1f1;
    color: var(--primary);
    padding-left: 15px;
}

.dropdown-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 0;
}

.mobile-menu-btn {
    display: none;
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    font-size: 23px;
    cursor: pointer;
    color: var(--text);
}

/* HERO */

.hero {
    background:
        radial-gradient(circle at 85% 20%, rgba(229, 50, 50, 0.10), transparent 30%),
        linear-gradient(135deg, #ffffff 0%, #fffafa 100%);
    padding: 90px 22px 85px;
    border-bottom: 1px solid #f0eeee;
}

.hero-inner {
    max-width: 1160px;
    margin: auto;
    display: grid;
    grid-template-columns: 1.35fr 0.65fr;
    align-items: center;
    gap: 55px;
}

.hero-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--primary);
    background: #fff0f0;
    border: 1px solid #ffdada;
    padding: 7px 13px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 23px;
}

.hero h1 {
    font-size: clamp(34px, 5vw, 54px);
    line-height: 1.15;
    letter-spacing: -1.8px;
    color: #202938;
    margin-bottom: 20px;
}

.hero h1 span {
    color: var(--primary);
}

.hero-description {
    max-width: 640px;
    color: #657184;
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 28px;
}

.hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 13px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 13px 21px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.btn-primary {
    background: var(--primary);
    color: #fff;
    border: 1px solid var(--primary);
}

.btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
}

.btn-outline {
    color: var(--text);
    border: 1px solid #d8dce4;
    background: #fff;
}

.btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.hero-panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 27px;
    box-shadow: var(--shadow);
}

.hero-panel-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 18px;
}

.hero-feature {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 13px 0;
    border-bottom: 1px solid #f0f1f4;
}

.hero-feature:last-child {
    border-bottom: 0;
}

.feature-icon {
    width: 39px;
    height: 39px;
    background: #fff0f0;
    color: var(--primary);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
}

.feature-text strong {
    display: block;
    font-size: 13px;
}

.feature-text small {
    color: var(--muted);
    font-size: 11px;
}

/* GENERAL SECTIONS */

.section {
    max-width: 1160px;
    margin: auto;
    padding: 75px 22px;
}

.section-heading {
    text-align: center;
    max-width: 650px;
    margin: 0 auto 38px;
}

.section-heading h2 {
    font-size: 30px;
    letter-spacing: -0.6px;
    margin-bottom: 10px;
}

.section-heading p {
    color: var(--muted);
    font-size: 14px;
}

/* CATEGORY CARDS */

.category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.category-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 25px 21px;
    transition: 0.25s;
    display: flex;
    flex-direction: column;
    min-height: 225px;
}

.category-card:hover {
    transform: translateY(-5px);
    border-color: #f1aaaa;
    box-shadow: var(--shadow);
}

.category-icon {
    width: 49px;
    height: 49px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: #fff0f0;
    color: var(--primary);
    font-size: 23px;
    margin-bottom: 18px;
}

.category-card h3 {
    font-size: 17px;
    margin-bottom: 8px;
}

.category-card p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.65;
    flex: 1;
}

.category-action {
    margin-top: 18px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    border: 0;
    background: transparent;
    text-align: left;
}

/* ABOUT */

.about-section {
    background: var(--light);
    border-top: 1px solid #eff0f3;
    border-bottom: 1px solid #eff0f3;
}

.about-inner {
    max-width: 1050px;
    margin: auto;
    padding: 75px 22px;
    display: grid;
    grid-template-columns: 1.4fr 0.6fr;
    gap: 50px;
    align-items: center;
}

.about-content h2 {
    font-size: 29px;
    margin-bottom: 17px;
}

.about-content p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.9;
    margin-bottom: 13px;
}

.owner-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 27px;
    text-align: center;
    box-shadow: var(--shadow);
}

.owner-avatar {
    width: 65px;
    height: 65px;
    margin: 0 auto 14px;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
}

.owner-card h3 {
    font-size: 17px;
    margin-bottom: 4px;
}

.owner-card p {
    color: var(--muted);
    font-size: 12px;
}
